<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Mi Apache funciona!</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; background: #17152b;
      color: #fff; font-family: Arial, sans-serif;
    }
    main {
      max-width: 650px; margin: 24px; padding: 48px;
      background: #27233f; border-radius: 24px;
      text-align: center; border: 2px solid #ad8aff;
    }
    h1 { color: #c6afff; font-size: 42px; }
    p { font-size: 20px; line-height: 1.6; }
    .etiqueta {
      display: inline-block; padding: 10px 18px;
      background: #433467; border-radius: 30px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main>
    <span class="etiqueta">Apache + Kubernetes</span>
    <h1>¡Sí funciona, profe!</h1>
    <p>No fue magia, fue Kubernetes.</p>
    <p>Mis Pods trabajan en equipo.<br>
    Si uno se va de vacaciones, el ReplicaSet busca reemplazo.</p>
    <p><strong>Estado del taller: sobreviviendo con estilo :)</strong></p>
  </main>
</body>
</html>
